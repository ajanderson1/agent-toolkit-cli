name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pre-release verification gate
        run: uv run pytest -q

      - name: Build, validate, and smoke test release artifacts
        id: build
        run: uv run python scripts/build_and_verify_release.py --tag ${{ github.ref_name }} --dist-dir dist

      - name: Upload release assets
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.wheel }}
            ${{ steps.build.outputs.sdist }}
            ${{ steps.build.outputs.receipt }}
            ${{ steps.build.outputs.sums }}
          fail_on_unmatched_files: true
